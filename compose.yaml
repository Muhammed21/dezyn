name: dezyn

# Environnement local. Profil par défaut : infrastructure seulement, les applications
# tournent sur l'hôte avec `pnpm dev`.

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-init:
    image: postgres:17.11-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${PG_DATABASE}
      PG_PASSWORD_MIGRATOR: ${PG_PASSWORD_MIGRATOR}
      PG_PASSWORD_APP: ${PG_PASSWORD_APP}
      PG_PASSWORD_HISTORY_MAINTAINER: ${PG_PASSWORD_HISTORY_MAINTAINER}
    volumes:
      - ./docker/postgres/init-roles.sh:/init-roles.sh:ro
    entrypoint: ["sh", "/init-roles.sh"]
    restart: "no"

  s3:
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./docker/seaweedfs/start.sh:/start.sh:ro
      - s3-data:/data
    entrypoint: ["sh", "/start.sh"]
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  s3-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/seaweedfs/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["sh", "/create-bucket.sh"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  s3-data:

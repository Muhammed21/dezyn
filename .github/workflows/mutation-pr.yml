name: mutation-pr

# Mute les seuls fichiers de production de l'API modifiés par la PR, puis publie le score et les
# survivants en commentaire. HEAD est le commit de merge de la PR sur la base actuelle : HEAD^1
# est cette base, alors que pull_request.base.sha peut dater de la création de la branche. Informatif : ne bloque jamais le merge (docs/TESTING.md, CI Gates).

on:
  pull_request:
    paths:
      - "apps/api/src/**"
      - "apps/api/stryker.config.mjs"
      - ".github/workflows/mutation-pr.yml"

concurrency:
  group: mutation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation:
    name: Mutation (fichiers modifiés)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # secretlint-disable -- identifiants factices, propres au service de la CI
      DATABASE_URL_MIGRATOR: postgresql://migrator:ci_migrator@127.0.0.1:5432/dezyn
      DATABASE_URL: postgresql://app:ci_app@127.0.0.1:5432/dezyn
      DATABASE_URL_HISTORY_MAINTAINER: postgresql://history_maintainer:ci_history_maintainer@127.0.0.1:5432/dezyn
      # secretlint-enable
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fichiers de production modifiés
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- 'apps/api/src/**/*.ts' \
            | grep -Ev '\.test\.ts$|^apps/api/src/testing/|^apps/api/src/main\.ts$' \
            | sed 's|^apps/api/||' | paste -sd, - || true)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Fichiers à muter : ${FILES:-aucun}"
      - if: steps.changed.outputs.files != ''
        uses: ./.github/actions/install
      - if: steps.changed.outputs.files != ''
        name: Provision PostgreSQL roles
        run: sh docker/postgres/init-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci_postgres
          PG_DATABASE: dezyn
          PG_PASSWORD_MIGRATOR: ci_migrator
          PG_PASSWORD_APP: ci_app
          PG_PASSWORD_HISTORY_MAINTAINER: ci_history_maintainer
      - if: steps.changed.outputs.files != ''
        name: Stryker
        working-directory: apps/api
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          pnpm exec stryker run --reporters clear-text --ignoreStatic --mutate "$FILES" \
            | tee ../../stryker.txt
      - name: Commentaire
        if: always()
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          {
            echo "### mutation — fichiers modifiés"
            echo
            if [ -z "$FILES" ]; then
              echo "_Aucun fichier de production de l'API modifié._"
            elif ! grep -q '^All files' stryker.txt; then
              echo "_Stryker n'a pas fini son rapport : voir les logs du job._"
            else
              echo "_Mutants statiques exclus (\`--ignoreStatic\`) : le score n'est pas celui du run local._"
              echo
              echo '```text'
              grep -A3 -E '^\[(Survived|NoCoverage|Timeout)\]' stryker.txt || echo "Aucun survivant."
              echo
              grep -E '^-+\|-|^File +\||^All files|^ +[^ ].*\.ts +\|' stryker.txt
              echo '```'
            fi
          } > mutation.md
          cat mutation.md
      - name: Publier le commentaire
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: dezyn-mutation
          path: mutation.md

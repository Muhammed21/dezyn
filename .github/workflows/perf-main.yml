name: perf-main

# Records a baseline bench-results.json on every push to main that touches benched code.
# perf-pr.yml downloads the latest successful artifact and diffs against it.
# Retention 30 days — long enough for any open PR to find a fresh baseline.

on:
  push:
    branches: [main]
    paths:
      - "apps/**/src/**"
      - "packages/**/src/**"
      - "**/bench/**"
      - "**/vitest.bench.config.ts"
      - ".github/scripts/bench-collect.sh"
      - ".github/scripts/perf-compare.mjs"
      - ".github/workflows/perf-main.yml"
  workflow_dispatch:

concurrency:
  group: perf-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Micro-bench (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # secretlint-disable -- identifiants factices, propres au service de la CI
      DATABASE_URL_MIGRATOR: postgresql://migrator:ci_migrator@127.0.0.1:5432/dezyn
      DATABASE_URL: postgresql://app:ci_app@127.0.0.1:5432/dezyn
      DATABASE_URL_HISTORY_MAINTAINER: postgresql://history_maintainer:ci_history_maintainer@127.0.0.1:5432/dezyn
      # secretlint-enable
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - name: Provision PostgreSQL roles
        run: sh docker/postgres/init-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci_postgres
          PG_DATABASE: dezyn
          PG_PASSWORD_MIGRATOR: ci_migrator
          PG_PASSWORD_APP: ci_app
          PG_PASSWORD_HISTORY_MAINTAINER: ci_history_maintainer
      - run: pnpm bench
      - run: .github/scripts/bench-collect.sh bench-results.json
      - name: Upload bench baseline
        uses: actions/upload-artifact@v6
        with:
          name: bench-baseline
          path: bench-results.json
          retention-days: 30
          if-no-files-found: error

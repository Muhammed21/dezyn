name: Preview

# Une CI verte sur une PR publie une version du Worker dezyn-api-preview sous l'alias pr-<N>,
# sur sa propre branche Neon, et commente son URL sur la PR (ADR 0034). La fermeture de la PR
# supprime sa branche Neon ; les versions restent sur Cloudflare.
# Le code de la PR ne tourne jamais à côté de NEON_API_KEY ni de CLOUDFLARE_API_TOKEN : build
# lit les URL Neon avant le checkout, puis migre et bundle sans jeton ; upload envoie ce bundle
# avec le code de main, sans exécuter celui de la PR.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-build-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    environment: preview
    outputs:
      publish: ${{ steps.origin.outputs.publish }}
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - id: origin
        name: Same repository
        env:
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ -z "$PR_NUMBER" ]; then
            echo "No preview: the pull request comes from the fork $HEAD_REPOSITORY." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - id: branch
        name: Neon branch
        if: steps.origin.outputs.publish == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          branch="pr-$PR_NUMBER"
          if ! npx --yes neonctl@2.47.0 branches get "$branch" --project-id "$NEON_PROJECT_ID" > /dev/null 2>&1; then
            npx --yes neonctl@2.47.0 branches create --project-id "$NEON_PROJECT_ID" --name "$branch" --parent preview > /dev/null
          fi
          url=$(npx --yes neonctl@2.47.0 connection-string "$branch" --project-id "$NEON_PROJECT_ID" --role-name migrator)
          echo "::add-mask::$url"
          echo "migrator_url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.origin.outputs.publish == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - if: steps.origin.outputs.publish == 'true'
        uses: ./.github/actions/install
      - name: Migrate
        if: steps.origin.outputs.publish == 'true'
        run: pnpm migrate
        env:
          DATABASE_URL_MIGRATOR: ${{ steps.branch.outputs.migrator_url }}
      - name: Bundle
        if: steps.origin.outputs.publish == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env preview --dry-run --outdir "$RUNNER_TEMP/bundle"
      - if: steps.origin.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-bundle
          path: ${{ runner.temp }}/bundle/worker.js
          retention-days: 1

  upload:
    name: Upload
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-upload-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      ALIAS_URL: https://pr-${{ github.event.workflow_run.pull_requests[0].number }}-dezyn-api-preview.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@v4
        with:
          name: preview-bundle
          path: ${{ runner.temp }}/bundle
      - id: database
        name: Neon app role
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          url=$(npx --yes neonctl@2.47.0 connection-string "pr-$PR_NUMBER" --project-id "$NEON_PROJECT_ID" --role-name app)
          echo "::add-mask::$url"
          echo "app_url=$url" >> "$GITHUB_OUTPUT"
      - id: upload
        name: Upload
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ steps.database.outputs.app_url }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          secrets_file="$RUNNER_TEMP/preview-secrets.json"
          jq -n '{DATABASE_URL: env.DATABASE_URL, BETTER_AUTH_SECRET: env.BETTER_AUTH_SECRET}' > "$secrets_file"
          pnpm exec wrangler versions upload "$RUNNER_TEMP/bundle/worker.js" \
            --config wrangler.jsonc \
            --no-bundle \
            --env preview \
            --preview-alias "pr-$PR_NUMBER" \
            --message "$HEAD_SHA" \
            --secrets-file "$secrets_file" \
            --var "BETTER_AUTH_URL:$ALIAS_URL" \
            --var "WEB_URL:$ALIAS_URL"
          rm "$secrets_file"
          uploaded=$(jq -sr 'map(select(.type == "version-upload")) | last' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ "$(jq -r '.preview_alias_url' <<< "$uploaded")" != "$ALIAS_URL" ]; then
            echo "::error::The alias URL is not $ALIAS_URL; check the WORKERS_SUBDOMAIN variable."
            exit 1
          fi
          echo "version_url=$(jq -r '.preview_url' <<< "$uploaded")" >> "$GITHUB_OUTPUT"
      - name: Health check
        run: |
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error --max-time 10 "$ALIAS_URL/health" && exit 0
            sleep 6
          done
          echo "::error::$ALIAS_URL/health does not answer 200 after the upload."
          exit 1
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
        run: |
          marker="<!-- dezyn:preview -->"
          body=$(printf '%s\n### Preview\n\n| | URL |\n| --- | --- |\n| PR | %s |\n| Commit `%s` | %s |\n' \
            "$marker" "$ALIAS_URL" "${HEAD_SHA:0:7}" "$VERSION_URL")
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

  clean:
    name: Clean
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Delete the Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if npx --yes neonctl@2.47.0 branches get "$BRANCH" --project-id "$NEON_PROJECT_ID" > /dev/null 2>&1; then
            npx --yes neonctl@2.47.0 branches delete "$BRANCH" --project-id "$NEON_PROJECT_ID" > /dev/null
            echo "Neon branch $BRANCH deleted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Neon branch $BRANCH to delete." >> "$GITHUB_STEP_SUMMARY"
          fi

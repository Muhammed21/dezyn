name: CI

# La CI est le seul arbitre : elle rejoue tout, sans filtrage par diff ni dépendance aux hooks locaux.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm secrets

  commits:
    name: Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - run: pnpm check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - run: pnpm test

  test-integration:
    name: Test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # secretlint-disable -- identifiants factices, propres au service de la CI
      DATABASE_URL_MIGRATOR: postgresql://migrator:ci_migrator@127.0.0.1:5432/dezyn
      DATABASE_URL: postgresql://app:ci_app@127.0.0.1:5432/dezyn
      DATABASE_URL_HISTORY_MAINTAINER: postgresql://history_maintainer:ci_history_maintainer@127.0.0.1:5432/dezyn
      DATABASE_URL_ADMIN: postgresql://postgres:ci_postgres@127.0.0.1:5432/postgres
      # secretlint-enable
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - name: Provision PostgreSQL roles
        run: sh docker/postgres/init-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci_postgres
          PG_DATABASE: dezyn
          PG_PASSWORD_MIGRATOR: ci_migrator
          PG_PASSWORD_APP: ci_app
          PG_PASSWORD_HISTORY_MAINTAINER: ci_history_maintainer
      - run: pnpm test:integration

  generated:
    name: Generated artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      # Un générateur de plus = une tâche turbo `generate`, rien à changer ici.
      - run: pnpm generate
      - name: Committed artefacts match their generators
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat
            echo "::error::Artefact généré non régénéré. Lancez 'pnpm generate' et committez."
            exit 1
          fi

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      # .gitignore ne protège pas un fichier déjà indexé.
      - name: No .env file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::Fichier .env versionné. Retirez-le avec 'git rm --cached' et faites tourner les secrets qu'il contient."
            exit 1
          fi
      - run: pnpm audit --prod --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - run: pnpm build
      - name: Preview bundle
        if: github.event_name == 'pull_request'
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env preview --dry-run --outdir "$RUNNER_TEMP/preview-bundle"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-bundle
          path: ${{ runner.temp }}/preview-bundle/worker.js
          retention-days: 3

  infra:
    name: Infra (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect changes that reach this job
        id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || ! git diff --quiet HEAD^1 -- docker compose.yaml .env.example .github/workflows/ci.yml packages/db pnpm-lock.yaml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/install
      - if: steps.changes.outputs.run == 'true'
        run: ./docker/tests/infra.test.sh

  ci-result:
    name: CI
    if: always()
    needs: [lint, commits, typecheck, test, test-integration, generated, hygiene, build, infra]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
